<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RawKnee — YouTube App Opener</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at top left, rgba(255, 36, 36, 0.22), transparent 35%),
      radial-gradient(circle at bottom right, rgba(255, 36, 36, 0.12), transparent 35%),
      linear-gradient(135deg, #030303, #111, #050505);
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 22px;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 42px 42px;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    width: 100%;
    max-width: 620px;
    background: rgba(8,8,8,0.96);
    border: 1px solid #282828;
    border-radius: 24px;
    padding: 34px;
    box-shadow: 0 0 55px rgba(255,0,0,0.18);
  }

  .logo {
    width: 100%;
    max-width: 430px;
    display: block;
    margin: 0 auto 16px;
  }

  .title {
    text-align: center;
    font-size: 14px;
    letter-spacing: 5px;
    color: #ff3333;
    margin-bottom: 8px;
    font-weight: 900;
  }

  .brandline {
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    color: #aaa;
    margin-bottom: 30px;
    text-transform: uppercase;
  }

  .card {
    background: #070707;
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 24px;
  }

  label {
    display: block;
    font-size: 12px;
    color: #aaa;
    letter-spacing: 3px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  input {
    width: 100%;
    padding: 16px;
    background: #050505;
    color: white;
    border: 1px solid #333;
    border-radius: 11px;
    font-size: 15px;
    outline: none;
  }

  input:focus {
    border-color: #ff2b2b;
    box-shadow: 0 0 18px rgba(255, 36, 36, 0.15);
  }

  button {
    width: 100%;
    margin-top: 14px;
    padding: 16px;
    background: #ff2424;
    color: white;
    border: none;
    border-radius: 11px;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
  }

  button:active {
    transform: scale(0.98);
  }

  .result {
    margin-top: 24px;
    display: none;
  }

  .result.show {
    display: block;
  }

  .linkbox {
    margin-top: 10px;
    background: #050505;
    border: 1px solid #333;
    border-radius: 11px;
    padding: 15px;
    color: #eee;
    font-size: 14px;
    word-break: break-all;
    user-select: all;
  }

  .button-row {
    display: flex;
    gap: 12px;
    margin-top: 14px;
  }

  .button-row button {
    margin-top: 0;
  }

  .copy {
    background: #222;
  }

  .test {
    background: #ff2424;
  }

  .reset {
    background: transparent;
    border: 1px solid #444;
    color: #ddd;
  }

  .error {
    color: #ff3b3b;
    font-size: 12px;
    margin-top: 10px;
    display: none;
  }

  .redirect {
    display: none;
    text-align: center;
  }

  .loader {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 5px solid #333;
    border-top-color: #ff2424;
    margin: 0 auto 22px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .redirect h1 {
    font-size: 34px;
    margin-bottom: 10px;
  }

  .redirect p {
    color: #aaa;
    font-size: 14px;
  }

  .redirect a {
    color: #ff3333;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff2424;
    color: #fff;
    padding: 14px 24px;
    border-radius: 12px;
    font-weight: 900;
    letter-spacing: 1px;
    box-shadow: 0 0 25px rgba(255,36,36,0.5);
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
  }

  @media (max-width: 600px) {
    .wrap {
      padding: 24px;
    }

    .button-row {
      flex-direction: column;
    }

    .logo {
      max-width: 340px;
    }
  }
</style>
</head>

<body>

<div class="wrap" id="main">
  <img src="logo.png" class="logo" alt="RawKnee">

  <div class="title">YOUTUBE APP LINK GENERATOR</div>
  <div class="brandline">Made for RawKnee Stories</div>

  <div class="card">
    <label>Paste YouTube Link</label>
    <input id="urlInput" type="text" placeholder="Paste YouTube video / Shorts link here">

    <button onclick="generateLink()">GENERATE LINK</button>

    <div class="error" id="error">Could not find a valid YouTube video ID.</div>

    <div class="result" id="result">
      <label>Your Story Link</label>
      <div class="linkbox" id="finalLink"></div>

      <div class="button-row">
        <button class="copy" onclick="copyLink()">COPY LINK</button>
        <button class="test" onclick="openTestLink()">OPEN TEST LINK</button>
      </div>

      <button class="reset" onclick="resetPage()">RESET</button>
    </div>
  </div>
</div>

<div class="wrap redirect" id="redirect">
  <div class="loader"></div>
  <h1>Opening YouTube</h1>
  <p id="fallback"></p>
</div>

<div class="toast" id="toast">Link copied!</div>

<script>
function extractVideoId(url) {
  if (!url) return null;

  if (/music\.youtube\.com/.test(url)) return null;

  const patterns = [
    /(?:youtube\.com\/watch\?(?:.*&)?v=)([a-zA-Z0-9_-]{11})/,
    /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
    /(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
    /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
    /(?:youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/,
    /^([a-zA-Z0-9_-]{11})$/
  ];

  for (const pattern of patterns) {
    const match = url.match(pattern);
    if (match) return match[1];
  }

  return null;
}

function generateLink() {
  const input = document.getElementById("urlInput").value.trim();
  const videoId = extractVideoId(input);
  const error = document.getElementById("error");
  const result = document.getElementById("result");
  const finalLink = document.getElementById("finalLink");

  if (!videoId) {
    error.style.display = "block";
    result.classList.remove("show");
    return;
  }

  error.style.display = "none";

  const baseUrl = window.location.origin + window.location.pathname.split("?")[0];
  const shareUrl = baseUrl + "?v=" + videoId;

  finalLink.textContent = shareUrl;
  result.classList.add("show");
}

function copyLink() {
  const text = document.getElementById("finalLink").textContent;

  navigator.clipboard.writeText(text).then(function () {
    showToast("Link copied!");
  });
}

function openTestLink() {
  const link = document.getElementById("finalLink").textContent;

  if (link) {
    window.open(link, "_blank");
  }
}

function resetPage() {
  document.getElementById("urlInput").value = "";
  document.getElementById("finalLink").textContent = "";
  document.getElementById("result").classList.remove("show");
  document.getElementById("error").style.display = "none";
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(function () {
    toast.classList.remove("show");
  }, 1800);
}

function openYouTube(videoId) {
  document.getElementById("main").style.display = "none";
  document.getElementById("redirect").style.display = "block";

  const ytWeb = "https://www.youtube.com/watch?v=" + videoId;
  document.getElementById("fallback").innerHTML =
    'Not opening? <a href="' + ytWeb + '">Tap here</a>';

  const ua = navigator.userAgent;

  if (/iPhone|iPad|iPod/i.test(ua)) {
    const iosLink = "youtube://www.youtube.com/watch?v=" + videoId;

    window.location.href = iosLink;

    let fallbackTimer = setTimeout(function () {
      window.location.href = ytWeb;
    }, 2500);

    const cancelFallback = function () {
      clearTimeout(fallbackTimer);
    };

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) cancelFallback();
    });

    window.addEventListener("pagehide", cancelFallback);

  } else if (/Android/i.test(ua)) {
    const intentLink =
      "intent://www.youtube.com/watch?v=" + videoId +
      "#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url=" +
      encodeURIComponent(ytWeb) +
      ";end";

    window.location.href = intentLink;

  } else {
    window.location.href = ytWeb;
  }
}

(function init() {
  const params = new URLSearchParams(window.location.search);
  const videoId = params.get("v");

  if (videoId && /^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
    openYouTube(videoId);
  }
})();
</script>

</body>
</html>
